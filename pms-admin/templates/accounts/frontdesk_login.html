{% extends 'base.html' %}

{% block title %}Front Desk Login{% endblock %}

{% block content %}

<div class="min-vh-100 d-flex align-items-center justify-content-center">

    <div class="card border-0 shadow-lg"
         style="width:430px; border-radius:20px;">

        <div class="card-body p-5">

            <div class="text-center mb-4">

                <div
                    class="mx-auto mb-3 rounded-circle bg-primary text-white d-flex align-items-center justify-content-center"
                    style="width:70px;height:70px;font-size:30px;"
                >
                    <i class="bi bi-building"></i>
                </div>

                <h2 class="fw-bold mb-1">
                    Front Desk
                </h2>

                <p class="text-muted mb-0">
                    Sign in to manage your hotel
                </p>

            </div>


            {% if messages %}

                {% for message in messages %}

                    <div class="alert alert-danger">

                        <i class="bi bi-exclamation-circle me-2"></i>

                        {{ message }}

                    </div>

                {% endfor %}

            {% endif %}


            <form method="POST">

                {% csrf_token %}


                <!-- Username -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Username
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-person"></i>
                        </span>

                        <input
                            type="text"
                            name="username"
                            class="form-control"
                            placeholder="Enter username"
                            required
                            autofocus
                        >

                    </div>

                </div>


                <!-- Password -->

                <div class="mb-3">

                    <label class="form-label fw-semibold">
                        Password
                    </label>

                    <div class="input-group">

                        <span class="input-group-text">
                            <i class="bi bi-lock"></i>
                        </span>

                        <input
                            type="password"
                            name="password"
                            id="loginPassword"
                            class="form-control"
                            placeholder="Enter password"
                            required
                        >

                        <button
                            type="button"
                            class="btn btn-outline-secondary"
                            onclick="toggleLoginPassword()"
                        >

                            <i
                                class="bi bi-eye"
                                id="loginPasswordIcon"
                            ></i>

                        </button>

                    </div>

                </div>


                <div class="text-end mb-4">

                    <a
                        href="#"
                        class="text-decoration-none"
                    >
                        Forgot Password?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary w-100 py-2"
                >

                    <i class="bi bi-box-arrow-in-right me-2"></i>

                    Login

                </button>

            </form>

        </div>

    </div>

</div>


<script>

function toggleLoginPassword() {

    const password =
        document.getElementById("loginPassword");

    const icon =
        document.getElementById("loginPasswordIcon");

    if (password.type === "password") {

        password.type = "text";

        icon.classList.remove("bi-eye");

        icon.classList.add("bi-eye-slash");

    } else {

        password.type = "password";

        icon.classList.remove("bi-eye-slash");

        icon.classList.add("bi-eye");

    }

}

</script>

{% endblock %}
