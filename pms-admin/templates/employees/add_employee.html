{% extends 'base.html' %}

{% block title %}Add Employee{% endblock %}

{% block content %}

<div class="d-flex justify-content-between align-items-center mb-4">

    <div>
        <h2 class="fw-bold mb-1">Add Employee</h2>
        <p class="text-muted mb-0">
            Create a new employee account.
        </p>
    </div>

    <a href="{% url 'employee-list' %}" class="btn btn-outline-secondary">
        <i class="bi bi-arrow-left"></i>
        Back
    </a>

</div>

<form>

<!-- Personal Information -->

<div class="card shadow-sm border-0 mb-4">

<div class="card-header bg-white">

<h5 class="mb-0">
👤 Personal Information
</h5>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">Full Name</label>

<input
type="text"
class="form-control"
placeholder="Enter Full Name">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Gender</label>

<select class="form-select">

<option>Select Gender</option>
<option>Male</option>
<option>Female</option>
<option>Other</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Phone Number</label>

<input
type="text"
class="form-control"
placeholder="Enter Phone Number">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Email</label>

<input
type="email"
class="form-control"
placeholder="Enter Email">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Date of Birth</label>

<input
type="date"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">Address</label>

<textarea
rows="3"
class="form-control"
placeholder="Enter Address"></textarea>

</div>

</div>

</div>

</div>

<!-- Employment -->

<div class="card shadow-sm border-0 mb-4">

<div class="card-header bg-white">

<h5 class="mb-0">
💼 Employment Information
</h5>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-6 mb-3">

<label class="form-label">

Employee ID

</label>

<input
type="text"
class="form-control"
placeholder="Auto Generated"
disabled>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Department

</label>

<select class="form-select">

<option>Front Office</option>
<option>Management</option>
<option>Accounts</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Role

</label>

<select class="form-select">

<option>Frontdesk</option>
<option>Manager</option>
<option>Admin</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Joining Date

</label>

<input
type="date"
class="form-control">

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Employment Type

</label>

<select class="form-select">

<option>Full Time</option>
<option>Part Time</option>

</select>

</div>

<div class="col-md-6 mb-3">

<label class="form-label">

Status

</label>

<select class="form-select">

<option>Active</option>
<option>Inactive</option>

</select>

</div>

</div>

</div>

</div>

<!-- Account -->

<div class="card shadow-sm border-0 mb-4">

<div class="card-header bg-white">

<h5 class="mb-0">
🔐 Account Information
</h5>

</div>

<div class="card-body">

<div class="row">

<div class="col-md-4 mb-3">

<label class="form-label">

Username

</label>

<input
type="text"
class="form-control"
placeholder="Username">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Password

</label>

<input
type="password"
class="form-control"
placeholder="Password">

</div>

<div class="col-md-4 mb-3">

<label class="form-label">

Confirm Password

</label>

<input
type="password"
class="form-control"
placeholder="Confirm Password">

</div>

<div class="col-md-12">

<label class="form-label">

Profile Photo

</label>

<input
type="file"
class="form-control">

</div>

</div>

</div>

</div>

<div class="text-end">

<a
href="{% url 'employee-list' %}"
class="btn btn-secondary">

Cancel

</a>

<button
class="btn btn-primary">

Save Employee

</button>

</div>

</form>

{% endblock %}
